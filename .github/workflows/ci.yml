on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      ocr: ${{ steps.detect.outputs.ocr }}
      skills: ${{ steps.detect.outputs.skills }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine affected areas
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/determine-affected-areas.sh

  api:
    name: API checks
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Read pnpm version from package.json
        id: pnpm-version
        shell: bash
        run: |
          version="$(just pnpm-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            api/pnpm-lock.yaml

      - name: Prepare api
        run: just prepare-api-ci

      - name: Run quality checks for api
        run: just quality-api

      - name: Run api tests
        run: just test-api

  ocr:
    name: OCR checks
    needs: changes
    if: needs.changes.outputs.ocr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: '0'
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache Paddle OCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex
          key: paddle-ocr-${{ runner.os }}-${{ hashFiles('uv.lock', 'ocr/pyproject.toml') }}
          restore-keys: |
            paddle-ocr-${{ runner.os }}-

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Prepare ocr
        run: just prepare-ocr

      - name: Run quality checks for ocr
        run: just quality-ocr

  skills:
    name: Skill script tests
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run skill tests
        run: just test-skills
