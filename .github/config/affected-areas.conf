# Configuration for determining which areas are affected by changed files

# Patterns that affect both api and app
BOTH=".github/workflows/*|justfile"

# Patterns that affect dependency-upgrade skill tests
SKILLS=".agents/skills/dependency-upgrade-best-practices/*"

# Patterns that affect api only
API="api/*|docker-compose.yml|package.json|pnpm-lock.yaml|.node-version|.oxlintrc.json|.oxfmtrc.json|tsconfig.json"

# Patterns that affect ocr only
OCR="ocr/*|pyproject.toml|uv.lock|.python-version"
